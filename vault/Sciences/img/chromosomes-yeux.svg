<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Paires de chromosomes 14 : couleur des yeux</title><desc id="d">Génotypes possibles pour les yeux marron, bleus et verts</desc><rect width="760" height="300" rx="14" fill="#fffaf5"/><text x="380.0" y="26" text-anchor="middle" font-size="16" fill="#4a4048" font-weight="700">Chromosome 14 : le gène de la couleur des yeux (m > b > v)</text><rect x="30" y="44" width="90" height="196" rx="12" fill="#f3d9b8" opacity=".55"/><rect x="53" y="64" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="53" y="98" width="14" height="7" fill="#e8789a"/><rect x="83" y="64" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="83" y="98" width="14" height="7" fill="#e8789a"/><text x="47" y="105" text-anchor="end" font-size="17" fill="#4a4048" font-weight="700">m</text><text x="103" y="105" text-anchor="start" font-size="17" fill="#4a4048" font-weight="700">m</text><text x="75" y="204" text-anchor="middle" font-size="13" fill="#4a4048" font-weight="700">m//m</text><rect x="140" y="44" width="90" height="196" rx="12" fill="#f3d9b8" opacity=".55"/><rect x="163" y="64" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="163" y="98" width="14" height="7" fill="#e8789a"/><rect x="193" y="64" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="193" y="98" width="14" height="7" fill="#e8789a"/><text x="157" y="105" text-anchor="end" font-size="17" fill="#4a4048" font-weight="700">m</text><text x="213" y="105" text-anchor="start" font-size="17" fill="#4a4048" font-weight="700">b</text><text x="185" y="204" text-anchor="middle" font-size="13" fill="#4a4048" font-weight="700">m//b</text><rect x="250" y="44" width="90" height="196" rx="12" fill="#f3d9b8" opacity=".55"/><rect x="273" y="64" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="273" y="98" width="14" height="7" fill="#e8789a"/><rect x="303" y="64" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="303" y="98" width="14" height="7" fill="#e8789a"/><text x="267" y="105" text-anchor="end" font-size="17" fill="#4a4048" font-weight="700">m</text><text x="323" y="105" text-anchor="start" font-size="17" fill="#4a4048" font-weight="700">v</text><text x="295" y="204" text-anchor="middle" font-size="13" fill="#4a4048" font-weight="700">m//v</text><rect x="405" y="44" width="90" height="196" rx="12" fill="#cfe4f7" opacity=".55"/><rect x="428" y="64" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="428" y="98" width="14" height="7" fill="#e8789a"/><rect x="458" y="64" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="458" y="98" width="14" height="7" fill="#e8789a"/><text x="422" y="105" text-anchor="end" font-size="17" fill="#4a4048" font-weight="700">b</text><text x="478" y="105" text-anchor="start" font-size="17" fill="#4a4048" font-weight="700">b</text><text x="450" y="204" text-anchor="middle" font-size="13" fill="#4a4048" font-weight="700">b//b</text><rect x="515" y="44" width="90" height="196" rx="12" fill="#cfe4f7" opacity=".55"/><rect x="538" y="64" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="538" y="98" width="14" height="7" fill="#e8789a"/><rect x="568" y="64" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="568" y="98" width="14" height="7" fill="#e8789a"/><text x="532" y="105" text-anchor="end" font-size="17" fill="#4a4048" font-weight="700">b</text><text x="588" y="105" text-anchor="start" font-size="17" fill="#4a4048" font-weight="700">v</text><text x="560" y="204" text-anchor="middle" font-size="13" fill="#4a4048" font-weight="700