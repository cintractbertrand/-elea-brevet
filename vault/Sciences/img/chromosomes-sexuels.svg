<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" width="860" height="290" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Chromosomes sexuels : daltonisme</title><desc id="d">Le gène est porté par le chromosome X, pas par le Y</desc><rect width="860" height="290" rx="14" fill="#fffaf5"/><text x="430.0" y="26" text-anchor="middle" font-size="14" fill="#4a4048" font-weight="700">Chromosomes sexuels : gène de la vision des couleurs (d+ normal dominant, d- daltonisme)</text><rect x="35" y="38" width="110" height="170" rx="12" fill="#f8d7e0" opacity=".55"/><rect x="63" y="52" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="63" y="86" width="14" height="7" fill="#e8789a"/><rect x="93" y="52" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="93" y="86" width="14" height="7" fill="#e8789a"/><text x="57" y="93" text-anchor="end" font-size="17" fill="#4a4048" font-weight="700">d⁻</text><text x="113" y="93" text-anchor="start" font-size="17" fill="#4a4048" font-weight="700">d⁻</text><text x="70" y="170" text-anchor="middle" font-size="14" fill="#4a4048">X</text><text x="100" y="170" text-anchor="middle" font-size="14" fill="#4a4048">X</text><text x="85" y="198" text-anchor="middle" font-size="13" fill="#4a4048" font-weight="700">Femme daltonienne</text><rect x="185" y="38" width="110" height="170" rx="12" fill="#cfe4f7" opacity=".55"/><rect x="213" y="52" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="213" y="86" width="14" height="7" fill="#e8789a"/><rect x="243" y="52" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="243" y="86" width="14" height="7" fill="#e8789a"/><text x="207" y="93" text-anchor="end" font-size="17" fill="#4a4048" font-weight="700">d⁺</text><text x="263" y="93" text-anchor="start" font-size="17" fill="#4a4048" font-weight="700">d⁺</text><text x="220" y="170" text-anchor="middle" font-size="14" fill="#4a4048">X</text><text x="250" y="170" text-anchor="middle" font-size="14" fill="#4a4048">X</text><text x="235" y="198" text-anchor="middle" font-size="13" fill="#4a4048" font-weight="700">Femme normale</text><rect x="335" y="38" width="110" height="170" rx="12" fill="#cfe4f7" opacity=".55"/><rect x="363" y="52" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="363" y="86" width="14" height="7" fill="#e8789a"/><rect x="393" y="52" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="393" y="86" width="14" height="7" fill="#e8789a"/><text x="357" y="93" text-anchor="end" font-size="17" fill="#4a4048" font-weight="700">d⁺</text><text x="413" y="93" text-anchor="start" font-size="17" fill="#4a4048" font-weight="700">d⁻</text><text x="370" y="170" text-anchor="middle" font-size="14" fill="#4a4048">X</text><text x="400" y="170" text-anchor="middle" font-size="14" fill="#4a4048">X</text><text x="385" y="198" text-anchor="middle" font-size="13" fill="#4a4048" font-weight="700">Femme normale</text><text x="310" y="226" text-anchor="middle" font-size="11" fill="#4a4048">(deux cas possibles pour la femme normale : d+//d+ ou d+//d-)</text><rect x="525" y="38" width="110" height="170" rx="12" fill="#f8d7e0" opacity=".55"/><rect x="553" y="52" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="553" y="86" width="14" height="7" fill="#e8789a"/><rect x="583" y="82" width="14" height="70" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><text x="547" y="93" text-anchor="end" font-size="17" fill="#4a4048" font-weight="700">d⁻</text><text x="560" y="170" text-anchor="middle" font-size="14" fill="#4a4048">X</text><text x="590" y="170" text-anchor="middle" font-size="14" fill="#4a4048">Y</text><text x="575" y="198" text-anchor="middle" font-size="13" fill="#4a4048" font-weight="700">Homme daltonien</text><rect x="675" y="38" width="110" height="170" rx="12" fill="#cfe4f7" opacity=".55"/><rect x="703" y="52" width="14" height="100" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><rect x="703" y="86" width="14" height="7" fill="#e8789a"/><rect x="733" y="82" width="14" height="70" rx="7" fill="#e6d4f0" stroke="#8a6fa0" stroke-width="2"/><text x="697" y="93" text-anchor="end" font-size="17" fill="#4a4048" font-weight="700">d⁺</text><text x="710" y="170" text-anchor="middle" font-size="14" fill="#4a4048">X</text><text x="740" y="170" text-anchor="middle" font-size="14" fill="#4a4048">Y</text><text x="725" y="198" text-anchor="middle" font-size="13" fill="#4a4048" font-weight="700">Homme normal</text><text x="430.0" y="270" text-anchor="middle" font-size="12" fill="#4a4048">La femme a XX (deux allèles). L’homme a XY : un seul allèle, sur le X, donc pas de « dominant » qui protège.</text></svg>
